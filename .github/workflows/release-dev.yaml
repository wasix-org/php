name: Release to Dev

on:
  push:
    tags:
      - "dev-*"

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3
        with:
          sparse-checkout: .

      - name: Validate version
        run: |
          TAG_NAME=${{github.ref_name}}
          VERSION_NUMBER=${TAG_NAME#dev-}
          echo "Checking version $VERSION_NUMBER"

          if ! grep -q "version = ['\"]$VERSION_NUMBER['\"]" wasmer-32.toml; then
            echo Tagged version $VERSION_NUMBER must match version in wasmer-32.toml
            exit -1
          fi

          if ! grep -q "version = ['\"]$VERSION_NUMBER['\"]" wasmer-64.toml; then
            echo Tagged version $VERSION_NUMBER must match version in wasmer-64.toml
            exit -1
          fi

          echo Version check passed ✅

  build-and-test:
    uses: "./.github/workflows/wasix-pr.yaml"
    needs: version-check
    secrets:
      SENDMAIL_DEFAULT_USERNAME: ${{ secrets.SENDMAIL_DEFAULT_USERNAME }}
      SENDMAIL_DEFAULT_PASSWORD: ${{ secrets.SENDMAIL_DEFAULT_PASSWORD }}

  release:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - version-check
    steps:
      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Check out
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          path: php

      - name: Check out php-wasix-deps
        uses: actions/checkout@v3
        with:
          repository: wasix-org/php-wasix-deps
          submodules: "recursive"
          path: php-wasix-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Publish
        run: |
          TAG_NAME=${{github.ref_name}}
          VERSION_NUMBER=${TAG_NAME#dev-}
          echo Publishing version $VERSION_NUMBER

          cd php

          mkdir -p sapi/cli

          mv ../build-artifacts/php-wasix-32/php.wasm sapi/cli/php.wasm
          wasmer publish wasmer-32.toml \
            --registry="wasmer.wtf" \
            --token=${{ secrets.WASMER_CIUSER_DEV_TOKEN }} \
            --non-interactive

          rm -f sapi/cli/php.wasm
          mv ../build-artifacts/php-wasix-64/php.wasm sapi/cli/php.wasm
          wasmer publish wasmer-64.toml \
            --registry="wasmer.wtf" \
            --token=${{ secrets.WASMER_CIUSER_DEV_TOKEN }} \
            --non-interactive

          echo PHP version $VERSION_NUMBER was published to wasmer.wtf successfully 🎉
